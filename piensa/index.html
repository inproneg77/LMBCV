<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#751b3c">
<meta name="description" content="Copa Caborca Piensa en Grande: equipos, calendario, resultados y estadísticas.">
<title>Copa Caborca Piensa en Grande</title>
<style>body{margin:0;background:#faf8f4;color:#57152f;font:16px/1.6 system-ui,sans-serif}main{max-width:38rem;margin:12vh auto;padding:2rem}h1{font:500 2.5rem Georgia,serif}a{color:#751b3c}button{background:#751b3c;color:#fff;border:0;padding:.8rem 1.2rem;border-radius:6px;font:inherit;cursor:pointer}</style>
</head>
<body>
<main aria-live="polite"><h1>Caborca Piensa en Grande</h1><p id="route-message" role="status">Cargando la copa…</p><p><a id="route-fallback" href="https://inproneg77.github.io/piensa/">Abrir el sitio de Copa</a></p></main>
<script>
(async function(){
'use strict';
const base='https://inproneg77.github.io/piensa/';
const direct=new URL(base);direct.search=location.search;direct.hash=location.hash;
document.getElementById('route-fallback').href=direct.href;
try{
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 let response,source;
 try{response=await fetch(base+'index.html?entry='+Date.now(),{cache:'no-store',credentials:'omit',signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);source=await response.text();}finally{clearTimeout(timer);}
 const parsed=new DOMParser().parseFromString(source,'text/html');
 if(!parsed.getElementById('tor-app')||!parsed.querySelector('script[src*="torneos-ui.js"]'))throw Error('La publicación de Copa no está lista.');
 for(const element of parsed.querySelectorAll('link[rel="stylesheet"][href],script[src],img[src]')){
  const attr=element.tagName==='LINK'?'href':'src';
  element.setAttribute(attr,new URL(element.getAttribute(attr),base).href);
 }
 // Keep navigation and browser storage on caborcavets.online; only assets use Copa's origin.
 document.documentElement.lang=parsed.documentElement.lang||'es';
 document.documentElement.innerHTML=parsed.documentElement.innerHTML;
 for(const inert of Array.from(document.querySelectorAll('script'))){
  const script=document.createElement('script');
  for(const attribute of Array.from(inert.attributes))if(!['async','defer'].includes(attribute.name))script.setAttribute(attribute.name,attribute.value);
  script.async=false;
  if(inert.hasAttribute('src')){
   await new Promise((ok,no)=>{const timeout=setTimeout(()=>no(Error('No se pudo cargar un recurso de Copa.')),15000);script.onload=()=>{clearTimeout(timeout);ok();};script.onerror=()=>{clearTimeout(timeout);no(Error('No se pudo cargar un recurso de Copa.'));};inert.replaceWith(script);});
  }else{script.textContent=inert.textContent;inert.replaceWith(script);}
 }
 document.dispatchEvent(new Event('DOMContentLoaded'));
}catch(error){
 document.body.innerHTML='<main><h1>Caborca Piensa en Grande</h1><p role="alert">No se pudo cargar la copa con esta conexión.</p><p><button type="button" id="route-retry">Reintentar</button></p><p><a id="route-fallback">Abrir el sitio de Copa</a></p></main>';
 document.getElementById('route-fallback').href=direct.href;
 document.getElementById('route-retry').onclick=()=>location.reload();
}
})();
</script>
</body>
</html>
