name: Validar LMBC
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pruebas de reglas, aislamiento, capturas y exportaciones
        run: node scripts/test.cjs
      - name: Validar enlaces locales y JSON
        run: node scripts/check-site.cjs
      - name: Generar vistas públicas de la misma revisión
        run: node scripts/build-public-data.cjs
