                value_field: "temporadas.*.id"
              - name: "ronda"
                label: "Ronda"
                widget: "select"
                options:
                  - { label: "Cuartos de Final", value: "Cuartos de Final" }
                  - { label: "Semifinal", value: "Semifinal" }
                  - { label: "Final", value: "Final" }
              - name: "equipoA"
                label: "Equipo A"
                widget: "relation"
                collection: "equipos_var40"
                file: "equipos_var40"
                search_fields: ["equipos.*.nombre"]
                display_fields: ["equipos.*.nombre"]
                value_field: "equipos.*.id"
              - name: "equipoB"
                label: "Equipo B"
                widget: "relation"
                collection: "equipos_var40"
                file: "equipos_var40"
                search_fields: ["equipos.*.nombre"]
                display_fields: ["equipos.*.nombre"]
                value_field: "equipos.*.id"
              - name: "mvp_serie"
                label: "Jugador(a) Más Valioso(a) DE LA SERIE (solo llenar si ronda = Final)"
                widget: "string"
                required: false
              - name: "juegos"
                label: "Juegos de la serie (agrega uno por uno conforme se jueguen, máximo 3)"
                widget: "list"
                summary: "Juego {{fields.numero}}"
                fields:
