        fields:
          - name: "series"
            label: "Series (a ganar 2 de 3 juegos)"
            widget: "list"
            summary: "{{fields.ronda}} — {{fields.equipoA}} vs {{fields.equipoB}}"
            fields:
              - { name: "id", label: "ID único (ej. sf-1)", widget: "string" }
              - name: "temporada"
                label: "Temporada"
                widget: "relation"
                collection: "temporadas"
                file: "temporadas"
                search_fields: ["temporadas.*.nombre"]
